events {
    worker_connections 1024;
}

http {    
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'CACHE-$upstream_cache_status';

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=reports_cache:100m 
                     max_size=10g inactive=1d use_temp_path=off;

    upstream minio_backend {
        server minio:9000;
    }

    server {
        listen 80;
        server_name localhost;

        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log warn;

        location / {
            return 404;
        }

        location ~ ^/reports/(.+)$ {
            proxy_pass http://minio_backend/reports/$1;
            
            proxy_cache reports_cache;
            proxy_cache_key "$request_uri";
            proxy_cache_valid 200 302 1h;
            proxy_cache_valid 404 1h;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            
            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Proxy-Path "/reports/$1";
            
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}