services:

  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - bionicpro

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME: localhost                                     # return http://localhost to the browser instead of http://keycloak
      KC_HOSTNAME_STRICT_BACK_CHANNEL: "false"                   # allow to use KC_HOSTNAME
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/keycloak-results-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      keycloak_db:
        condition: service_healthy
      openldap:
        condition: service_started
    networks:
      - bionicpro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_REPORTS_URL: http://localhost:8001
      REACT_APP_KEYCLOAK_REALM: reports-realm
      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend
    networks:
      - bionicpro

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      TOKEN_ENCRYPT_KEY: ${TOKEN_ENCRYPT_KEY}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://redis:6379
      AUTH_HOST: localhost
      AUTH_PORT: 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthcheck', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - redis
    networks:
      - bionicpro

  reports:
    build:
      context: ./reports
      dockerfile: Dockerfile
    ports:
      - 8001:8001
    environment:
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      REPORTS_PORT: 8001
      AUTH_HOST: auth
      AUTH_PORT: 8000
      OLAP_CONNECTION_STR: clickhouse://olap_user:olap_password@olap_db:8123/bionicpro
      S3_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SEKRET_KEY: ${S3_SEKRET_KEY}
      CDN_URL: http://localhost:8082
    depends_on:
      auth:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - bionicpro

  redis:
    image: redis:7-alpine
    restart: always
    command: sh -c "redis-server --requirepass $$REDIS_PASSWORD --maxmemory 256mb --maxmemory-policy allkeys-lru"
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks:
      - bionicpro

  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: "bionicpro"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "config"
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/01-users.ldif
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    ports:
      - "389:389"
      - "636:636"
    command: --copy-service
    networks:
      - bionicpro

  telemetry_db:
    image: influxdb:3-core
    ports:
      - 8181:8181
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3
      - --admin-token-file=/run/secrets/admin-token
    volumes:
      - telemetry_data:/var/lib/influxdb3
    secrets:
      - admin-token
    healthcheck:
      test: ["CMD-SHELL", "pgrep influxdb3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - bionicpro

  olap_db:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: olap_user
      CLICKHOUSE_PASSWORD: olap_password
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "EXISTS TABLE bionicpro.users_replica"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./olap_db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bionicpro

  crm_db:
    image: postgres:14
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
      - ./crm_db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - bionicpro

  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - bionicpro

  cdc:
    image: debezium/connect:2.4
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
    depends_on:
      kafka:
        condition: service_started
      crm_db:
        condition: service_healthy
    networks:
      - bionicpro

  cdc_init:
    image: curlimages/curl:8.2.1
    restart: "no"
    volumes:
      - ./cdc/debezium_init.sh:/debezium_init.sh
    entrypoint: ["/bin/sh", "/debezium_init.sh"]
    depends_on:
      cdc:
        condition: service_started
      olap_db:
        condition: service_healthy
    networks:
      - bionicpro

  airflow_db:
    image: postgres:14
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow_user
      POSTGRES_PASSWORD: airflow_pass
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow_user -d airflow"]
      interval: 5s
      retries: 5
    networks:
      - bionicpro

  airflow:
    image: apache/airflow:3.2.2-python3.11
    build:
      context: ./data_pipeline
      dockerfile: Dockerfile
    command: standalone  
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:airflow_pass@airflow_db:5432/airflow
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: True

      TM_DB_URL: http://telemetry_db:8181
      TM_DB_TOKEN_FILE: ./static_token.json
      TM_DB_DATA: ./data.csv
      OLAP_CONNECTION_STR: "clickhouse://olap_user:olap_password@olap_db:8123/bionicpro"
    volumes:
      - ./telemetry_db/static_token.json:/opt/airflow/static_token.json:ro
      - ./telemetry_db/data.csv:/opt/airflow/data.csv:ro
      - ./data_pipeline/dags:/opt/airflow/dags
    ports:
      - "8081:8080"
    depends_on:
      airflow_db:
        condition: service_healthy
      crm_db:
        condition: service_healthy
      telemetry_db:
        condition: service_healthy
      olap_db:
        condition: service_healthy
    networks:
      - bionicpro

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SEKRET_KEY: ${S3_SEKRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"   # Web консоль
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - bionicpro

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set bionicpro http://minio:9000 minioadmin minioadmin;
      mc mb bionicpro/reports --ignore-existing;
      mc anonymous set download bionicpro/reports;
      echo 'Bucket reports created and set to public download';
      exit 0;
      "
    networks:
      - bionicpro

  cdn:
    image: nginx:alpine
    volumes:
      - ./cdn/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
    ports:
      - "8082:80"
    restart:
      always
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - bionicpro

volumes:
  pgdata:
  redisdata:
  ldap_data:
  ldap_config:
  telemetry_data:
  clickhouse_data:
  airflow_pgdata:
  crm_pgdata:
  minio_data:
  nginx_cache:

secrets:
  admin-token:
    file: ./telemetry_db/static_token.json

networks:
  bionicpro:
    name: bionicpro
    driver: bridge
